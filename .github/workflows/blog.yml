# Writes one blog draft a week from blog/topics.json and opens a pull request with it. Merging the pull request is the
# publish step, so nothing reaches weidhaus.com without the author's review. One open draft at a time: while a draft
# waits for review, the scheduled run does nothing.
name: blog
on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: blog
jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip while a draft waits for review
        id: open
        run: echo "count=$(gh pr list --label blog-draft --state open --json number --jq length)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.open.outputs.count == '0'
        with:
          node-version: 22
      - run: npm ci
        if: steps.open.outputs.count == '0'
      - name: Write the next draft
        id: draft
        if: steps.open.outputs.count == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
        run: node scripts/blog.mjs
      - name: Open the pull request
        if: steps.draft.outputs.slug
        env:
          SLUG: ${{ steps.draft.outputs.slug }}
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "blog/$SLUG"
          git add "blog/posts/$SLUG.json"
          git commit -m "Draft blog post: $TITLE"
          git push -u origin "blog/$SLUG"
          gh label create blog-draft --color BFD4F2 --description "Blog draft waiting for review" --force
          gh pr create --draft --label blog-draft --title "Blog: $TITLE" --body "Entwurf aus der Themenliste. Bitte vor dem Mergen prüfen:

          - Stimmt jede Aussage über Projekte mit den Quellen in \`sources\` überein?
          - Steht nirgends ein Beweggrund oder Ergebnis, das nicht stimmt?
          - Text direkt in dieser Datei bearbeiten (\`intro\`, \`sections\`, \`faq\` und \`markdown\`).

          Mergen veröffentlicht den Beitrag. Schließen verwirft ihn; das Thema kommt dann beim nächsten Lauf wieder dran."
