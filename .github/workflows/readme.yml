# Regenerates README.md whenever projects.json or the generator changes, so the profile never drifts from the site.
name: readme
on:
  push:
    branches: [master]
    paths: [projects.json, scripts/build-readme.mjs, README.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-readme.mjs
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Regenerate README from projects.json"
          git push
